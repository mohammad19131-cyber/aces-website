




<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ABR — Digital Magazine</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- StPageFlip -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07080b;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      flex: 0 0 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: #0c0e13;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      z-index: 20;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: 3px;
      font-size: 15px;
      font-weight: 700;
    }

    .page-counter {
      color: rgba(255, 255, 255, .7);
      font-size: 13px;
      letter-spacing: 1px;
    }

    .reader {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px 70px 72px;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.055), transparent 52%),
        #07080b;
    }

    #book {
      position: relative;
      width: min(86vw, 1100px);
      height: min(76vh, 780px);
    }

    .page {
      background: #fff;
      overflow: hidden;
    }

    .page canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      z-index: 10;
      background: #07080b;
      transition: opacity .35s ease;
    }

    .loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 2px solid rgba(255,255,255,.15);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .loading-text {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,.65);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .nav {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 15;
    }

    .nav button {
      pointer-events: auto;
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      border: 1px solid rgba(255,255,255,.25);
      background: rgba(8, 9, 12, .82);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 20px;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .nav button:hover {
      background: rgba(255,255,255,.12);
      border-color: rgba(255,255,255,.55);
    }

    .nav button:active {
      transform: translateY(-50%) scale(.94);
    }

    #prev {
      left: 14px;
    }

    #next {
      right: 14px;
    }

    .bottom-bar {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(620px, calc(100% - 40px));
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 20;
    }

    .progress {
      flex: 1;
      height: 3px;
      appearance: none;
      background: rgba(255,255,255,.2);
      cursor: pointer;
    }

    .progress::-webkit-slider-thumb {
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .progress::-moz-range-thumb {
      width: 15px;
      height: 15px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      color: rgba(255,255,255,.4);
      font-size: 11px;
      letter-spacing: 1px;
      white-space: nowrap;
      pointer-events: none;
    }

    .error {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 30;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background: #07080b;
    }

    .error.show {
      display: flex;
    }

    .error-inner {
      max-width: 500px;
    }

    .error h2 {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
    }

    .error p {
      margin: 0;
      color: rgba(255,255,255,.65);
      line-height: 1.6;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      .topbar {
        height: 52px;
        flex-basis: 52px;
        padding: 0 15px;
      }

      .brand {
        font-size: 12px;
        letter-spacing: 2px;
      }

      .reader {
        padding: 8px 8px 60px;
      }

      #book {
        width: min(94vw, 560px);
        height: min(78vh, 760px);
      }

      .nav button {
        width: 40px;
        height: 40px;
        background: rgba(8, 9, 12, .65);
      }

      #prev {
        left: 6px;
      }

      #next {
        right: 6px;
      }

      .hint {
        display: none;
      }

      .bottom-bar {
        bottom: 16px;
      }
    }

    @media (max-width: 700px) {

.reader {
  padding: 8px 5px 60px;
}

#book {
  width: 92vw;
  height: auto;
  margin: 0 auto;
}

.page {
  width: 100%;
  height: 100%;
  background: #fff;
  overflow: hidden;
}

.page canvas {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.nav button {
  width: 40px;
  height: 40px;
}

#prev {
  left: 5px;
}

#next {
  right: 5px;
}

.hint {
  display: none;
}

.bottom-bar {
  bottom: 14px;
  width: calc(100% - 35px);
}

}

  </style>
</head>

<body>
  <header class="topbar">
    <div class="brand">ABR</div>
    <div class="page-counter" id="counter">Loading…</div>
  </header>

  <main class="reader">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">Opening magazine</div>
    </div>

    <div id="book"></div>

    <div class="nav">
      <button id="prev" aria-label="Previous page">‹</button>
      <button id="next" aria-label="Next page">›</button>
    </div>

    <div class="hint">SWIPE OR DRAG THE PAGE CORNER TO TURN</div>

    <div class="bottom-bar">
      <input id="progress" class="progress" type="range" min="1" max="102" value="1">
    </div>

    <div class="error" id="error">
      <div class="error-inner">
        <h2>Unable to open the magazine</h2>
        <p id="errorText">
          Make sure <strong>ABR.pdf</strong> is in the same folder as this index.html file
          and open the site through a local/server URL rather than directly from a restricted file URL.
        </p>
      </div>
    </div>
  </main>

  <script>
 
/* =========================================================
   ABR DIGITAL MAGAZINE
   ========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================================================
   CONFIGURATION
   ========================================================= */

const PDF_URL = "ABR.pdf";
const TOTAL_PAGES = 102;

const MOBILE_BREAKPOINT = 700;


/* =========================================================
   STATE
   ========================================================= */

let pdf = null;
let flipBook = null;

let currentPage = 1;

let pageWidth = 595;
let pageHeight = 842;

let isMobile = false;

const renderedPages = new Set();
const loadingPages = new Set();


/* =========================================================
   DOM ELEMENTS
   ========================================================= */

const bookEl =
  document.getElementById("book");

const counterEl =
  document.getElementById("counter");

const progressEl =
  document.getElementById("progress");

const loadingEl =
  document.getElementById("loading");

const loadingTextEl =
  document.getElementById("loadingText");

const errorEl =
  document.getElementById("error");

const errorTextEl =
  document.getElementById("errorText");

const previousButton =
  document.getElementById("prev");

const nextButton =
  document.getElementById("next");


/* =========================================================
   DEVICE DETECTION
   ========================================================= */

function detectDevice() {

  isMobile =
    window.matchMedia(
      `(max-width: ${MOBILE_BREAKPOINT}px)`
    ).matches;

}


/* =========================================================
   LOADING SCREEN
   ========================================================= */

function setLoading(text) {

  if (!loadingTextEl) return;

  loadingTextEl.textContent = text;

}


function hideLoading() {

  if (!loadingEl) return;

  loadingEl.classList.add("hidden");

}


function showLoading() {

  if (!loadingEl) return;

  loadingEl.classList.remove("hidden");

}


/* =========================================================
   ERROR HANDLING
   ========================================================= */

function showError(message) {

  console.error(message);

  if (errorTextEl) {

    errorTextEl.textContent =
      message;

  }

  if (errorEl) {

    errorEl.classList.add("show");

  }

  hideLoading();

}


/* =========================================================
   PAGE COUNTER
   ========================================================= */

function updateCounter(pageNumber) {

  currentPage =
    Math.max(
      1,
      Math.min(
        TOTAL_PAGES,
        Number(pageNumber)
      )
    );


  if (counterEl) {

    counterEl.textContent =
      `${currentPage} / ${TOTAL_PAGES}`;

  }


  if (progressEl) {

    progressEl.value =
      currentPage;

  }

}


/* =========================================================
   CREATE EMPTY PAGE
   ========================================================= */

function createPageElement(pageNumber) {

  const page =
    document.createElement("div");

  page.className =
    "page";


  page.dataset.pageNumber =
    pageNumber;


  page.dataset.rendered =
    "false";


  const canvas =
    document.createElement("canvas");


  canvas.className =
    "pdf-page";


  canvas.setAttribute(
    "aria-label",
    `Magazine page ${pageNumber}`
  );


  page.appendChild(canvas);


  return page;

}


/* =========================================================
   CREATE ALL PAGE CONTAINERS
   ========================================================= */

function createPageContainers() {

  const fragment =
    document.createDocumentFragment();


  for (
    let pageNumber = 1;
    pageNumber <= TOTAL_PAGES;
    pageNumber++
  ) {

    fragment.appendChild(
      createPageElement(pageNumber)
    );

  }


  bookEl.appendChild(fragment);

}


/* =========================================================
   FIND PAGE ELEMENT
   ========================================================= */

function getPageElement(pageNumber) {

  return bookEl.querySelector(
    `.page[data-page-number="${pageNumber}"]`
  );

}


/* =========================================================
   RENDER ONE PDF PAGE
   ========================================================= */

async function renderPage(pageNumber) {

  /*
    Don't render outside PDF.
  */

  if (
    pageNumber < 1 ||
    pageNumber > TOTAL_PAGES
  ) {

    return;

  }


  /*
    Don't render an already
    rendered page.
  */

  if (
    renderedPages.has(pageNumber)
  ) {

    return;

  }


  /*
    Prevent duplicate simultaneous
    renders.
  */

  if (
    loadingPages.has(pageNumber)
  ) {

    return;

  }


  loadingPages.add(
    pageNumber
  );


  try {

    console.log(
      `Rendering page ${pageNumber}`
    );


    setLoading(
      `Loading page ${pageNumber}`
    );


    /*
      Get PDF page.
    */

    const pdfPage =
      await pdf.getPage(
        pageNumber
      );


    /*
      Get HTML page.
    */

    const pageElement =
      getPageElement(
        pageNumber
      );


    if (!pageElement) {

      return;

    }


    const canvas =
      pageElement.querySelector(
        "canvas"
      );


    if (!canvas) {

      return;

    }


    const context =
      canvas.getContext(
        "2d",
        {
          alpha: false
        }
      );


    /*
      Get original PDF dimensions.
    */

    const viewport =
      pdfPage.getViewport({
        scale: 1
      });


    /*
      Determine available space.
    */

    const containerWidth =
      pageElement.clientWidth ||
      bookEl.clientWidth ||
      600;


    const containerHeight =
      pageElement.clientHeight ||
      bookEl.clientHeight ||
      850;


    /*
      Calculate scale while
      preserving PDF proportions.
    */

    const widthScale =
      containerWidth /
      viewport.width;


    const heightScale =
      containerHeight /
      viewport.height;


    const fitScale =
      Math.min(
        widthScale,
        heightScale
      );


    /*
      Retina support.
    */

    const devicePixelRatio =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );


    const renderScale =
      fitScale *
      devicePixelRatio;


    const renderViewport =
      pdfPage.getViewport({
        scale: renderScale
      });


    /*
      Canvas resolution.
    */

    canvas.width =
      Math.floor(
        renderViewport.width
      );


    canvas.height =
      Math.floor(
        renderViewport.height
      );


    /*
      Canvas display size.
    */

    canvas.style.width =
      "100%";

    canvas.style.height =
      "100%";


    canvas.style.objectFit =
      "contain";


    /*
      Render PDF page.
    */

    await pdfPage.render({

      canvasContext:
        context,

      viewport:
        renderViewport,

      background:
        "white"

    }).promise;


    /*
      Mark as rendered.
    */

    renderedPages.add(
      pageNumber
    );


    pageElement.dataset.rendered =
      "true";


    console.log(
      `Page ${pageNumber} ready`
    );


  } catch (error) {

    console.error(
      `Failed rendering page ${pageNumber}`,
      error
    );


  } finally {

    loadingPages.delete(
      pageNumber
    );

  }

}


/* =========================================================
   PRELOAD FIRST THREE PAGES
   ========================================================= */

async function preloadFirstPages() {

  /*
    IMPORTANT:

    These pages are loaded
    sequentially.

    Page 1
       ↓
    Page 2
       ↓
    Page 3
  */

  for (
    let pageNumber = 1;
    pageNumber <= 3;
    pageNumber++
  ) {

    setLoading(
      `Preparing page ${pageNumber} of 3`
    );


    await renderPage(
      pageNumber
    );

  }

}


/* =========================================================
   LOAD CURRENT PAGE
   ========================================================= */

async function loadCurrentPage(
  pageNumber
) {

  await renderPage(
    pageNumber
  );

}


/* =========================================================
   LOAD ONE PAGE AHEAD
   ========================================================= */

function preloadNextPage(
  pageNumber
) {

  const nextPage =
    pageNumber + 1;


  if (
    nextPage > TOTAL_PAGES
  ) {

    return;

  }


  /*
    Delay this slightly so
    it doesn't compete with
    the page currently being
    rendered.
  */

  setTimeout(
    () => {

      renderPage(
        nextPage
      );

    },
    300
  );

}


/* =========================================================
   LOAD ONE PAGE BEHIND
   ========================================================= */

function preloadPreviousPage(
  pageNumber
) {

  const previousPage =
    pageNumber - 1;


  if (
    previousPage < 1
  ) {

    return;

  }


  setTimeout(
    () => {

      renderPage(
        previousPage
      );

    },
    300
  );

}


/* =========================================================
   PAGE FLIP EVENTS
   ========================================================= */

function setupFlipEvents() {

  if (!flipBook) return;


  flipBook.on(
    "flip",
    async function(event) {

      /*
        PageFlip uses zero-based
        page indexes.
      */

      const pageNumber =
        event.data + 1;


      updateCounter(
        pageNumber
      );


      /*
        Load only the page
        the user has reached.
      */

      await loadCurrentPage(
        pageNumber
      );


      /*
        Load ONE page ahead.
      */

      preloadNextPage(
        pageNumber
      );


      /*
        Load ONE page behind.
      */

      preloadPreviousPage(
        pageNumber
      );

    }
  );


  /*
    Orientation change.
  */

  flipBook.on(
    "changeOrientation",
    function() {

      setTimeout(
        function() {

          renderPage(
            currentPage
          );

        },
        200
      );

    }
  );

}


/* =========================================================
   CALCULATE BOOK SIZE
   ========================================================= */

function calculateBookSize() {

  detectDevice();


  const aspectRatio =
    pageHeight /
    pageWidth;


  let width;


  if (isMobile) {

    /*
      MOBILE:

      One page.

      Almost the entire
      width of the phone.
    */

    width =
      Math.min(
        window.innerWidth * 0.90,
        560
      );


  } else {

    /*
      DESKTOP:

      The flipbook will show
      two pages side by side.
    */

    width =
      Math.min(
        window.innerWidth * 0.42,
        620
      );

  }


  const height =
    width *
    aspectRatio;


  return {
    width,
    height
  };

}


/* =========================================================
   CREATE FLIPBOOK
   ========================================================= */

function createFlipBook() {

  const size =
    calculateBookSize();


  flipBook =
    new St.PageFlip(
      bookEl,
      {

        width:
          size.width,

        height:
          size.height,


        /*
          Stretch to available
          container.
        */

        size:
          "stretch",


        minWidth:
          280,

        maxWidth:
          900,


        minHeight:
          400,

        maxHeight:
          1200,


        /*
          Do NOT use showCover.

          This avoids the first
          pages being rotated/
          rearranged unexpectedly.
        */

        showCover:
          false,


        /*
          THIS IS THE IMPORTANT
          MOBILE SETTING.

          Desktop:
          false = two-page spread

          Mobile:
          true = one-page view
        */

        usePortrait:
          isMobile,


        /*
          Allow touch/swipe.
        */

        mobileScrollSupport:
          false,


        /*
          Page turn speed.
        */

        flippingTime:
          650,


        /*
          Page shadows.
        */

        drawShadow:
          true,

        maxShadowOpacity:
          0.35,


        /*
          Responsive sizing.
        */

        autoSize:
          true,


        /*
          Start on page 1.
        */

        startPage:
          0,


        startZIndex:
          0

      }
    );


  /*
    Load the empty pages.
  */

  flipBook.loadFromHTML(
    Array.from(
      bookEl.querySelectorAll(
        ".page"
      )
    )
  );


  /*
    Setup swipe/flip events.
  */

  setupFlipEvents();

}


/* =========================================================
   GO TO SPECIFIC PAGE
   ========================================================= */

async function goToPage(
  pageNumber
) {

  pageNumber =
    Math.max(
      1,
      Math.min(
        TOTAL_PAGES,
        Number(pageNumber)
      )
    );


  if (!flipBook) {

    return;

  }


  /*
    Render destination first.
  */

  await renderPage(
    pageNumber
  );


  /*
    PageFlip starts at index 0.
  */

  flipBook.flip(
    pageNumber - 1
  );


  updateCounter(
    pageNumber
  );

}


/* =========================================================
   PREVIOUS BUTTON
   ========================================================= */

if (previousButton) {

  previousButton.addEventListener(
    "click",
    function() {

      if (!flipBook) {

        return;

      }


      flipBook.flipPrev();

    }
  );

}


/* =========================================================
   NEXT BUTTON
   ========================================================= */

if (nextButton) {

  nextButton.addEventListener(
    "click",
    function() {

      if (!flipBook) {

        return;

      }


      flipBook.flipNext();

    }
  );

}


/* =========================================================
   PROGRESS SLIDER
   ========================================================= */

if (progressEl) {

  progressEl.min =
    1;

  progressEl.max =
    TOTAL_PAGES;

  progressEl.value =
    1;


  progressEl.addEventListener(
    "change",
    async function(event) {

      await goToPage(
        event.target.value
      );

    }
  );

}


/* =========================================================
   KEYBOARD NAVIGATION
   ========================================================= */

window.addEventListener(
  "keydown",
  function(event) {

    if (!flipBook) {

      return;

    }


    /*
      Previous page.
    */

    if (
      event.key ===
      "ArrowLeft"
    ) {

      event.preventDefault();

      flipBook.flipPrev();

    }


    /*
      Next page.
    */

    if (
      event.key ===
      "ArrowRight"
    ) {

      event.preventDefault();

      flipBook.flipNext();

    }


    /*
      First page.
    */

    if (
      event.key ===
      "Home"
    ) {

      event.preventDefault();

      goToPage(
        1
      );

    }


    /*
      Last page.
    */

    if (
      event.key ===
      "End"
    ) {

      event.preventDefault();

      goToPage(
        TOTAL_PAGES
      );

    }

  }
);


/* =========================================================
   RESIZE HANDLING
   ========================================================= */

let resizeTimer;


window.addEventListener(
  "resize",
  function() {

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        function() {

          /*
            Detect whether the
            device changed between
            mobile and desktop.
          */

          const oldMobile =
            isMobile;


          detectDevice();


          if (
            oldMobile !==
            isMobile
          ) {

            /*
              Orientation mode changed.

              Rebuild the flipbook.
            */

            rebuildFlipBook();

          }

        },
        350
      );

  }
);


/* =========================================================
   REBUILD FLIPBOOK
   ========================================================= */

function rebuildFlipBook() {

  if (!pdf) {

    return;

  }


  /*
    Remember current page.
  */

  const savedPage =
    currentPage;


  /*
    Destroy old flipbook.
  */

  if (flipBook) {

    try {

      flipBook.destroy();

    } catch (error) {

      console.warn(
        "Could not destroy old flipbook",
        error
      );

    }

  }


  /*
    Clear book.
  */

  bookEl.innerHTML =
    "";


  /*
    Recreate page containers.
  */

  createPageContainers();


  /*
    Create new flipbook.
  */

  createFlipBook();


  /*
    Update page counter.
  */

  updateCounter(
    savedPage
  );


  /*
    Restore current page.
  */

  setTimeout(
    async function() {

      await renderPage(
        savedPage
      );


      if (flipBook) {

        flipBook.flip(
          savedPage - 1
        );

      }

    },
    150
  );

}


/* =========================================================
   INITIALIZE MAGAZINE
   ========================================================= */

async function initializeMagazine() {

  try {

    showLoading();


    setLoading(
      "Opening Aitchison Business Review..."
    );


    /*
      Detect mobile/desktop.
    */

    detectDevice();


    /*
      Load the PDF.
    */

    pdf =
      await pdfjsLib
        .getDocument({

          url:
            PDF_URL,

          disableAutoFetch:
            false,

          disableStream:
            false

        })
        .promise;


    console.log(
      `PDF loaded: ${pdf.numPages} pages`
    );


    /*
      Check number of pages.
    */

    if (
      pdf.numPages !==
      TOTAL_PAGES
    ) {

      console.warn(
        `Expected ${TOTAL_PAGES} pages but PDF contains ${pdf.numPages}`
      );

    }


    /*
      Get dimensions from
      the first PDF page.
    */

    const firstPage =
      await pdf.getPage(
        1
      );


    const firstViewport =
      firstPage.getViewport({
        scale: 1
      });


    pageWidth =
      firstViewport.width;


    pageHeight =
      firstViewport.height;


    /*
      Create empty page elements.
    */

    createPageContainers();


    /*
      Create flipbook.
    */

    createFlipBook();


    /*
      Start counter.
    */

    updateCounter(
      1
    );


    /*
      PRELOAD ONLY:

      Page 1
      Page 2
      Page 3

      And do it sequentially.
    */

    await preloadFirstPages();


    /*
      Magazine is now ready.
    */

    setLoading(
      "Ready"
    );


    setTimeout(
      function() {

        hideLoading();

      },
      200
    );


    console.log(
      "ABR magazine ready."
    );


  } catch (error) {

    console.error(
      "ABR initialization failed:",
      error
    );


    showError(

      "The magazine could not be loaded. " +

      "Make sure ABR.pdf is beside index.html. " +

      "Error: " +

      (
        error &&
        error.message
          ? error.message
          : "Unknown error"
      )

    );

  }

}




initializeMagazine();


  </script>
